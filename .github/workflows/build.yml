name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Optional service credentials, baked into the builds when the repository secrets exist.
# Without them the launcher still builds; players can add their own under Settings > Services.
env:
  CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
  URANIUM_MSA_CLIENT_ID: ${{ secrets.URANIUM_MSA_CLIENT_ID }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :shared:allTests --console=plain

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # Debug-signed so it installs without a release keystore; release signing comes later.
      - run: ./gradlew :androidApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v5
        with:
          name: UraniumLauncher-android-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Windows MSI + EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # jpackage (bundled with the JDK) builds the installers and the trimmed runtime.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :desktopApp:packageMsi :desktopApp:packageExe --console=plain
      # Smoke test the app image the installers are made from: it must start and reach Mojang.
      - name: Smoke test
        shell: pwsh
        run: |
          ./gradlew :desktopApp:createDistributable --console=plain
          $exe = "desktopApp/build/compose/binaries/main/app/UraniumLauncher/UraniumLauncher.exe"
          $out = & $exe --cli versions | Out-String
          Write-Host $out
          if ($out -notmatch "Latest release") { throw "Launcher CLI did not list versions" }
      - uses: actions/upload-artifact@v5
        with:
          name: UraniumLauncher-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: UraniumLauncher-windows-exe
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
