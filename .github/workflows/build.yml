name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the APK, MSI and EXE as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: read

# Optional values compiled into the builds when they are set under
# Settings > Secrets and variables > Actions (as a variable or a secret; either works).
# Both are public by nature: a Microsoft application id is an identifier, not a password, and the
# share server address is just a URL. The CurseForge API key is deliberately NOT built in:
# CurseForge's terms forbid disclosing it, and anything inside a downloadable app can be read out.
env:
  URANIUM_MSA_CLIENT_ID: ${{ vars.URANIUM_MSA_CLIENT_ID || secrets.URANIUM_MSA_CLIENT_ID }}
  URANIUM_SHARE_URL: ${{ vars.URANIUM_SHARE_URL || secrets.URANIUM_SHARE_URL }}

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release && 'release' || 'ci' }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :shared:allTests --console=plain
      - name: Share server tests
        working-directory: worker
        run: npm test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # Debug-signed so it installs without a release keystore; release signing comes later.
      - run: ./gradlew :androidApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v5
        with:
          name: UraniumLauncher-android-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Windows MSI + EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # jpackage (bundled with the JDK) builds the installers and the trimmed runtime.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :desktopApp:packageMsi :desktopApp:packageExe --console=plain
      # Smoke test the app image the installers are made from: it must start and reach Mojang.
      - name: Smoke test
        shell: pwsh
        run: |
          ./gradlew :desktopApp:createDistributable --console=plain
          $exe = "desktopApp/build/compose/binaries/main/app/UraniumLauncher/UraniumLauncher.exe"
          $out = & $exe --cli versions | Out-String
          Write-Host $out
          if ($out -notmatch "Latest release") { throw "Launcher CLI did not list versions" }
      - uses: actions/upload-artifact@v5
        with:
          name: UraniumLauncher-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: UraniumLauncher-windows-exe
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

  # Runs only when started by hand with "release" ticked (Actions > Build > Run workflow), or for
  # a pushed tag such as v0.2.0. Publishes the files built above; nothing is rebuilt here.
  release:
    name: Publish release
    if: (github.event_name == 'workflow_dispatch' && inputs.release) || startsWith(github.ref, 'refs/tags/v')
    needs: [test, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^uranium.version=' gradle.properties | cut -d= -f2)
          tag="v$version"
          mkdir out
          mv dist/*.apk "out/UraniumLauncher-$version-android.apk"
          mv dist/*.msi "out/UraniumLauncher-$version-windows.msi"
          mv dist/*.exe "out/UraniumLauncher-$version-windows-setup.exe"
          (cd out && sha256sum * > SHA256SUMS.txt)
          cat > notes.md <<NOTES
          ## Downloads
          - **Windows**: \`UraniumLauncher-$version-windows-setup.exe\` (or the \`.msi\`). Windows SmartScreen warns because the installer is not code-signed yet: choose *More info > Run anyway*.
          - **Android**: \`UraniumLauncher-$version-android.apk\`. The launcher UI, downloads and mod browser work; starting the game on Android is not implemented yet.

          Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --target "$GITHUB_SHA" --title "Uranium Launcher $version" --notes-file notes.md
          fi
